name: Release

# A tag `v<version>` (after the "Release <version>" commit) packages the addon and uploads it to
# CurseForge. The project id is `## X-Curse-Project-ID` in Polestar_UI.toc; the API key is the
# repository secret CF_API_KEY.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0 # v2.6.1
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
